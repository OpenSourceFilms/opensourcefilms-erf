name: ERF outcome journal offline acceptance
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/outcomes-core.yml"
      - "src/erf/outcomes.py"
      - "src/erf/paths.py"
      - "tests/test_outcomes_portability_unittest.py"
      - "examples/explicit_outcomes_demo.py"
  pull_request:
    paths:
      - ".github/workflows/outcomes-core.yml"
      - "src/erf/outcomes.py"
      - "src/erf/paths.py"
      - "tests/test_outcomes_portability_unittest.py"
      - "examples/explicit_outcomes_demo.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outcomes-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pin Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check isolated journal portability
        run: python -B -m unittest discover -s tests -p "test_outcomes_portability_unittest.py" -v
      - name: Run disposable outcome demo
        run: python examples/explicit_outcomes_demo.py
